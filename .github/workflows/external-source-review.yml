name: External source visual review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/external-source-review.yml'
      - 'tools/materialize_external_source_review.py'
      - 'tools/test_materialize_external_source_review.py'
      - 'docs/evidence/external-source-001-jessica-cruz-source-map-2026-10-15.json'
      - 'config/external-sources/external-source-001.json'
  workflow_dispatch:
    inputs:
      source_map:
        description: Versioned external source review map
        required: true
        default: docs/evidence/external-source-001-jessica-cruz-source-map-2026-10-15.json
        type: string

permissions:
  contents: read

concurrency:
  group: external-source-review-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_MAP: ${{ github.event_name == 'workflow_dispatch' && inputs.source_map || 'docs/evidence/external-source-001-jessica-cruz-source-map-2026-10-15.json' }}

jobs:
  review:
    name: Materialize exact source review bytes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test source review guards
        working-directory: tools
        run: python -m unittest -v test_materialize_external_source_review.py
      - name: Inspect source review state
        id: source_state
        shell: bash
        run: |
          python - "$SOURCE_MAP" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          source_map = Path(sys.argv[1])
          output = Path(sys.argv[2])
          data = json.loads(source_map.read_text(encoding='utf-8'))
          missing = data.get('missingSource')
          needs_review = isinstance(missing, dict) and isinstance(missing.get('images'), list) and bool(missing['images'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"needs_review={'true' if needs_review else 'false'}\n")
          print(json.dumps({
              'sourceMap': str(source_map),
              'sourceReviewComplete': data.get('decision', {}).get('sourceReviewComplete'),
              'needsMaterialization': needs_review,
          }, ensure_ascii=False))
          PY
      - name: Materialize exact reviewed source
        if: steps.source_state.outputs.needs_review == 'true'
        run: >-
          python tools/materialize_external_source_review.py "$SOURCE_MAP"
          --source-contract config/external-sources/external-source-001.json
          --output "$RUNNER_TEMP/external-source-review"
      - name: Assert read-only result
        if: steps.source_state.outputs.needs_review == 'true'
        shell: bash
        run: |
          python - "$RUNNER_TEMP/external-source-review/review-manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['visualDecisionMade'] is False
          assert data['productionWrites'] == 0
          assert data['stagingWrites'] == 0
          print(json.dumps(data, ensure_ascii=False))
          PY
      - name: Confirm completed review needs no materialization
        if: steps.source_state.outputs.needs_review != 'true'
        shell: bash
        run: |
          python - "$SOURCE_MAP" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data.get('missingSource') is None
          assert data.get('decision', {}).get('sourceReviewComplete') is True
          assert data.get('writes', {}).get('production') == 0
          assert data.get('writes', {}).get('staging') == 0
          print(json.dumps({'state':'already_reviewed','productionWrites':0,'stagingWrites':0}))
          PY
      - name: Upload short-lived source review artifact
        if: steps.source_state.outputs.needs_review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-source-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-source-review
          if-no-files-found: error
          retention-days: 1
