name: Deploy live preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify main push provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/check_main_push_provenance.mjs
      - name: Install
        run: npm ci
      - name: Validate public runtime configuration
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_API_BASE_URL VITE_TURNSTILE_SITE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Repository Variables: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Verify live artifact excludes demo catalog data
        run: node tools/check_demo_catalog_artifact.mjs dist absent
      - name: Reject legacy public R2 endpoint from generated frontend
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --binary-files=without-match -nE 'https://[^"'"'"' ]+\.r2\.dev' dist; then
            echo '::error::Build contém endpoint público r2.dev; mídia deve sair exclusivamente pelo Worker.'
            exit 1
          fi
      - name: Validate generated brand artifacts
        run: npm run brand:dist
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Smoke test published preview
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          EXPECTED_PUBLIC_URL="$(node -e "const fs=require('node:fs'); const runtime=JSON.parse(fs.readFileSync('config/public-runtime.json','utf8')); process.stdout.write(runtime.publicSiteUrl);")"
          case "$EXPECTED_PUBLIC_URL" in */) ;; *) EXPECTED_PUBLIC_URL="$EXPECTED_PUBLIC_URL/" ;; esac
          BRAND_NAME="$(node -e "const fs=require('node:fs'); const brand=JSON.parse(fs.readFileSync('config/brand.json','utf8')); process.stdout.write(brand.name);")"
          SHORT_NAME="$(node -e "const fs=require('node:fs'); const brand=JSON.parse(fs.readFileSync('config/brand.json','utf8')); process.stdout.write(brand.shortName);")"
          BRAND_INITIAL="$(node -e "const fs=require('node:fs'); const brand=JSON.parse(fs.readFileSync('config/brand.json','utf8')); process.stdout.write(Array.from(brand.shortName.trim())[0]?.toLocaleUpperCase('pt-BR') ?? '?');")"
          CATALOG_NAME="$(node -e "const fs=require('node:fs'); const brand=JSON.parse(fs.readFileSync('config/brand.json','utf8')); process.stdout.write(brand.catalogLabel + ' ' + brand.name);")"
          HTML="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PAGE_URL")"
          printf '%s' "$HTML" | grep -Fq "$BRAND_NAME"
          printf '%s' "$HTML" | grep -Fq "rel=\"canonical\" href=\"$EXPECTED_PUBLIC_URL\""
          MANIFEST_URL="${PAGE_URL%/}/site.webmanifest"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$MANIFEST_URL" \
            | node -e "const expectedName=process.argv[1]; const expectedShort=process.argv[2]; let body=''; process.stdin.on('data', c => body += c).on('end', () => { const data = JSON.parse(body); if (data.name !== expectedName || data.short_name !== expectedShort) process.exit(1); console.log('Preview manifest ready:', data.name); });" "$CATALOG_NAME" "$SHORT_NAME"
          FAVICON_URL="${PAGE_URL%/}/favicon.svg"
          FAVICON="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$FAVICON_URL")"
          printf '%s' "$FAVICON" | grep -Fq ">$BRAND_INITIAL</text>"
          echo "Preview brand assets ready: $BRAND_NAME ($SHORT_NAME)"
