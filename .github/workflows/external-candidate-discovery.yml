name: External candidate discovery

on:
  workflow_dispatch:
    inputs:
      page:
        description: Bounded Store API page used only when product_id is empty
        required: true
        default: '44'
        type: string
      per_page:
        description: Products requested from the bounded source page (max 20)
        required: true
        default: '20'
        type: string
      max_products:
        description: Maximum products to hash when no exact product id is selected
        required: true
        default: '7'
        type: string
      product_id:
        description: Optional exact Store API product id; bypasses unstable pagination
        required: false
        default: ''
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/external-candidate-discovery.yml'
      - 'tools/discover_external_staging_candidates.py'
      - 'tools/test_discover_external_staging_candidates.py'
      - 'tools/enrich_external_candidate_identity.py'
      - 'tools/test_enrich_external_candidate_identity.py'

permissions:
  contents: read

concurrency:
  group: external-candidate-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DISCOVERY_PAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.page || '44' }}
  DISCOVERY_PER_PAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.per_page || '20' }}
  DISCOVERY_MAX_PRODUCTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_products || '7' }}
  DISCOVERY_PRODUCT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.product_id || '' }}

jobs:
  discover:
    name: Read-only bounded discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify read-only discovery bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          test -n "$database_id" || { echo '::error::D1 database id ausente'; exit 1; }
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Test discovery guards
        working-directory: tools
        run: >-
          python -m unittest -v
          test_discover_external_staging_candidates.py
          test_enrich_external_candidate_identity.py
      - name: Discover candidates without writes
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --page "$DISCOVERY_PAGE"
            --per-page "$DISCOVERY_PER_PAGE"
            --max-products "$DISCOVERY_MAX_PRODUCTS"
            --max-review-products 3
            --output "$RUNNER_TEMP/external-candidate-discovery"
          )
          if [[ -n "$DISCOVERY_PRODUCT_ID" ]]; then
            args+=(--product-id "$DISCOVERY_PRODUCT_ID")
          fi
          python tools/discover_external_staging_candidates.py "${args[@]}"
      - name: Attach production covers for identity review
        run: >-
          python tools/enrich_external_candidate_identity.py
          "$RUNNER_TEMP/external-candidate-discovery/discovery-report.json"
          --review-root "$RUNNER_TEMP/external-candidate-discovery/review"
      - name: Assert discovery remained read-only
        shell: bash
        run: |
          python - "$RUNNER_TEMP/external-candidate-discovery/discovery-report.json" "$DISCOVERY_PRODUCT_ID" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          target=str(sys.argv[2] or '').strip()
          assert report['productionWrites'] == 0
          assert report['stagingWrites'] == 0
          if target:
              assert report.get('selectionMode') == 'exact_product_endpoint'
              assert report.get('requestedProductId') == int(target)
              assert report['productsScanned'] == 1
              assert report['products'][0]['productId'] == int(target)
          for product in report['products']:
              assert product.get('promotable') is not True
              assert product.get('identityDecision') != 'map_existing'
              assert product.get('identityDecision') != 'new_model'
              for match in product.get('identityReviewCandidates') or []:
                  assert match.get('matchBasis') == 'name_or_search_hint_review_only'
          print(json.dumps({
              'selectionMode': report.get('selectionMode'),
              'requestedProductId': report.get('requestedProductId'),
              'productsScanned': report['productsScanned'],
              'sourceBytesHashed': report['sourceBytesHashed'],
              'productionCoverReviewObjects': report.get('productionCoverReviewObjects', 0),
              'states': [row.get('state') for row in report['products']],
          }, ensure_ascii=False))
          PY
      - name: Upload short-lived review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: external-candidate-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-candidate-discovery
          if-no-files-found: error
          retention-days: 1
