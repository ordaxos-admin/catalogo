name: Staging product reverse index

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: First stable ID-ordered Store API page to scan
        required: true
        default: '78'
        type: string
      start_product_offset:
        description: Zero-based product offset within the first stable page
        required: true
        default: '9'
        type: string
      end_page:
        description: Last Store API page to scan (max 25 pages per run)
        required: true
        default: '102'
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/staging-product-index.yml'
      - 'tools/index_external_staging_products.py'
      - 'tools/discover_external_staging_candidates.py'
      - 'tools/test_index_external_staging_products.py'
      - 'tools/test_index_external_staging_products_oversize.py'
      - 'tools/test_index_external_staging_products_prefetch.py'
      - 'tools/test_discover_external_staging_candidates_http.py'

permissions:
  contents: read

concurrency:
  group: staging-product-index-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  START_PAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_page || '78' }}
  START_PRODUCT_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.start_product_offset || '9' }}
  END_PAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_page || '102' }}

jobs:
  index:
    name: Read-only staged SHA product index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify read-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
      - name: Test reverse-index guards
        working-directory: tools
        run: >-
          python -m unittest -v
          test_index_external_staging_products.py
          test_index_external_staging_products_oversize.py
          test_index_external_staging_products_prefetch.py
          test_discover_external_staging_candidates_http.py
      - name: Build bounded reverse index
        run: >-
          python tools/index_external_staging_products.py
          --start-page "$START_PAGE"
          --start-product-offset "$START_PRODUCT_OFFSET"
          --end-page "$END_PAGE"
          --max-pages 25
          --per-page 20
          --max-total-bytes 268435456
          --checkpoint "$RUNNER_TEMP/staging-product-index/checkpoint.json"
          --output "$RUNNER_TEMP/staging-product-index/report.json"
      - name: Assert index remained read-only and resumable
        shell: bash
        run: |
          python - "$RUNNER_TEMP/staging-product-index/report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert report['sourceOrdering'] == 'id_asc'
          assert report['productionWrites'] == 0
          assert report['stagingWrites'] == 0
          assert report['stagingInventoryObjects'] > 0
          assert report.get('nextPage') is None or int(report['nextPage']) >= 1
          assert int(report.get('nextProductOffset', 0)) >= 0
          for product in report['products']:
              assert product['stagedImageCount'] > 0
              assert product['sourceImageCount'] >= product['stagedImageCount']
              for image in product['images']:
                  if image['stagingVerified']:
                      assert image['stagingKey']
                  if image.get('reviewOnly') is True:
                      assert not image['stagingVerified']
                      assert image['sha256'] is None
                      assert image['stagingKey'] is None
                      assert str(image.get('hashSkippedReason') or '').startswith('source_exceeds_max_image_bytes')
          print(json.dumps({
              'sourceOrdering': report['sourceOrdering'],
              'pagesCompleted': report['pagesCompleted'],
              'productsScanned': report['productsScanned'],
              'matchedProductCount': report['matchedProductCount'],
              'completeStagingProducts': report['completeStagingProducts'],
              'sourceBytesHashed': report['sourceBytesHashed'],
              'nextPage': report.get('nextPage'),
              'nextProductOffset': report.get('nextProductOffset', 0),
          }, ensure_ascii=False))
          PY
      - name: Upload reverse-index evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-product-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-product-index
          if-no-files-found: error
          retention-days: 3
