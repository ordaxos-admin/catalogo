name: Staged perceptual review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/staged-perceptual-review.yml'
      - 'tools/materialize_staged_perceptual_review.py'
      - 'tools/test_materialize_staged_perceptual_review.py'
      - 'docs/evidence/external-source-001-artemis-preflight-2026-10-15.json'
      - 'config/external-sources/external-source-001.json'
  workflow_dispatch:
    inputs:
      evidence:
        description: Versioned perceptual-review evidence
        required: true
        default: docs/evidence/external-source-001-artemis-preflight-2026-10-15.json
        type: string

permissions:
  contents: read

concurrency:
  group: staged-perceptual-review-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  REVIEW_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence || 'docs/evidence/external-source-001-artemis-preflight-2026-10-15.json' }}

jobs:
  review:
    name: Materialize exact staged review bytes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test review guards
        working-directory: tools
        run: python -m unittest -v test_materialize_staged_perceptual_review.py
      - name: Assert Cloudflare read bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
      - name: Materialize exact review pair
        run: >-
          python tools/materialize_staged_perceptual_review.py "$REVIEW_EVIDENCE"
          --source-contract config/external-sources/external-source-001.json
          --output "$RUNNER_TEMP/staged-perceptual-review"
      - name: Assert read-only result
        shell: bash
        run: |
          python - "$RUNNER_TEMP/staged-perceptual-review/review-manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['reviewDecisionMade'] is False
          assert data['productionWrites'] == 0
          assert data['stagingWrites'] == 0
          assert len(data['reviewFiles']) >= 2
          print(json.dumps(data, ensure_ascii=False))
          PY
      - name: Upload short-lived visual review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-perceptual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-perceptual-review
          if-no-files-found: error
          retention-days: 1
