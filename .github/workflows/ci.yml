name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify main push provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/check_main_push_provenance.mjs
      - name: Test main push provenance contract
        run: npm run test:main-provenance
      - name: Test catalog runtime SSOT
        run: npm run test:catalog-runtime
      - name: Install frontend and tooling
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test bounded browser metadata cache
        run: npm run test:known-cache
      - name: Test canonical Wrangler config
        run: npm run test:wrangler-config
      - name: Test operational continuity SSOT
        run: node --test tools/test_operational_continuity.mjs
      - name: Test Cloudflare deploy-state contract
        run: npm run test:cloudflare-deploy-state
      - name: Test canonical Worker release smoke
        run: npm run test:worker-release-smoke
      - name: Test Workers Cache hit verifier
        run: node --test tools/test_worker_cache_hit.mjs
      - name: Test promoted Worker propagation contract
        run: npm run test:promoted-worker
      - name: Test semantic Cloudflare drift gate
        run: npm run test:remote-worker-config
      - name: Test private R2 public-media gateway
        run: npm run test:worker-media-contract
      - name: Test gallery runtime validation
        run: npm run test:gallery-runtime
      - name: Test Worker gallery smoke contract
        run: npm run test:worker-gallery-contract
      - name: Test Worker folder count contract
        run: npm run test:worker-folder-counts
      - name: Test Worker public search contract
        run: npm run test:worker-search-contract
      - name: Test Worker schema contract
        run: npm run test:worker-schema-contract
      - name: Test Worker health contract
        run: npm run test:worker-health-contract
      - name: Test legacy model aliases
        run: npm run test:model-aliases
      - name: Test public gallery revision
        run: npm run test:public-gallery-revision
      - name: Test legacy gallery grouping
        run: npm run test:legacy-gallery-grouping
      - name: Test legacy gallery repair aliases
        run: npm run test:legacy-gallery-repairs-contract
      - name: Test catalog home display contract
        run: npm run test:catalog-home
      - name: Test gallery grid navigation
        run: npm run test:gallery-grid
      - name: Check dialog architecture
        run: npm run dialog:a11y
      - name: Build frontend
        run: npm run build
      - name: Verify live artifact excludes demo catalog data
        run: node tools/check_demo_catalog_artifact.mjs dist absent
      - name: Build explicit demo artifact
        env:
          VITE_CATALOG_MODE: demo
          DEMO_ARTIFACT_DIR: ${{ runner.temp }}/catalog-demo-artifact
        run: npx vite build --outDir "$DEMO_ARTIFACT_DIR"
      - name: Verify explicit demo artifact contains demo catalog data
        env:
          DEMO_ARTIFACT_DIR: ${{ runner.temp }}/catalog-demo-artifact
        run: node tools/check_demo_catalog_artifact.mjs "$DEMO_ARTIFACT_DIR" present
      - name: Check frontend performance budget
        run: npm run budget:frontend
      - name: Typecheck Cloudflare Worker
        run: npm run typecheck:worker
      - name: Render deployment config
        run: npm run cloudflare:config
      - name: Dry-run staged Worker upload with secret binding
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/tonecos-worker-secrets-ci.json"
          trap 'rm -f "$secrets_file"' EXIT
          printf '%s\n' '{"TURNSTILE_SECRET_KEY":"ci-contract-placeholder"}' > "$secrets_file"
          chmod 600 "$secrets_file"
          npx wrangler versions upload \
            --dry-run \
            --strict \
            --secrets-file "$secrets_file" \
            --config .wrangler.deploy.jsonc
      - name: Materialize verified Worker bundle
        run: npx esbuild worker/entry.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=worker-dist/worker.js
      - name: Upload verified Worker bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-dry-run-${{ github.sha }}
          path: worker-dist/
          if-no-files-found: error
          retention-days: 1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install ingestion dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test catalog pipelines and schema
        working-directory: tools
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v test_catalog_schema_contract.py test_migration_deploy_policy.py test_gallery_member_integrity_migration.py test_audit_d1_integrity.py test_ingest_catalog.py test_import_woocommerce_catalog.py test_import_woocommerce_catalog_identity_hardening.py test_build_external_image_manifest.py test_propose_external_identity_matches.py test_resolve_external_identity_matches.py test_audit_model_identity.py test_build_media_bundle.py test_apply_legacy_gallery_repairs.py test_backfill_image_source_index.py test_plan_gallery_merge.py test_creator_attribution_policy.py test_resolve_gallery_merge.py test_build_gallery_promotion_manifest.py test_verify_gallery_promotion_manifest.py test_multi_image_release_contract.py test_publish_r2.py test_reconcile_r2_state.py test_publish_d1.py test_publish_readiness.py test_verify_public_catalog.py test_catalog_folders_schema.py test_search_schema.py test_quote_schema.py test_quote_dedup.py test_shared_collections_schema.py test_pages_workflow_config.py test_cloudflare_workflow_config.py test_cloudflare_d1_scope_contract.py test_cloudflare_runtime_trigger_scope.py test_main_push_provenance_workflows.py test_github_actions_pins.py test_brand_identity.py test_verify_r2_recovery.py test_materialize_r2_recovery.py test_apply_r2_recovery_registry.py test_apply_r2_recovery_registry_partial.py test_preflight_catalog_closeout.py test_index_external_staging_products.py test_index_external_staging_products_oversize.py test_index_external_staging_products_prefetch.py test_discover_external_staging_candidates_http.py test_external_batch_005_contract.py test_external_batch_006_contract.py test_external_batch_007_contract.py test_external_batch_008_contract.py test_external_batch_009_contract.py test_external_batch_010_contract.py 2>&1 | tee "$RUNNER_TEMP/catalog-python-tests.log"
      - name: Upload Python failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-test-failure-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-python-tests.log
          if-no-files-found: error
          retention-days: 1
