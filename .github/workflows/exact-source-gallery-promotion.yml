name: Exact source gallery promotion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/exact-source-gallery-promotion.yml'
      - 'tools/apply_exact_source_gallery_promotion.py'
      - 'tools/test_apply_exact_source_gallery_promotion.py'
      - 'tools/preflight_exact_source_gallery_evidence.py'
      - 'tools/test_preflight_exact_source_gallery_evidence.py'
      - 'tools/apply_existing_gallery_promotion.py'
      - 'docs/evidence/external-source-001-*-gallery-review-*.json'
      - 'docs/evidence/external-source-001-*-canonical-preflight-*.json'
      - 'config/external-sources/external-source-001.json'
      - 'wrangler.jsonc'
  workflow_dispatch:
    inputs:
      evidence:
        description: Exact-source gallery review evidence
        required: true
        default: docs/evidence/external-source-001-artemis-gallery-review-2026-10-15.json
        type: string
      authorization:
        description: Canonical exact-source preflight authorization
        required: true
        default: docs/evidence/external-source-001-artemis-canonical-preflight-2026-10-15.json
        type: string
      apply:
        description: Write new R2 objects and atomically update D1
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: exact-source-gallery-promotion-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
  GALLERY_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence || '' }}
  GALLERY_AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || '' }}
  APPLY_GALLERY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}

jobs:
  promote:
    name: Exact-source gallery promotion gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install ingestion dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Resolve D1 database binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID ausente'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN ausente'; exit 1; }
          database_id="$(node tools/read_wrangler_d1_id.mjs)"
          test -n "$database_id" || { echo '::error::D1 database id ausente'; exit 1; }
          echo "CLOUDFLARE_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"
      - name: Require public verification endpoint before apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CATALOG_API_URL" || { echo '::error::CATALOG_API_URL ausente; apply bloqueado antes de qualquer write'; exit 1; }
          case "$CATALOG_API_URL" in
            https://*) ;;
            *) echo '::error::CATALOG_API_URL deve usar HTTPS; apply bloqueado antes de qualquer write'; exit 1 ;;
          esac
      - name: Test exact-source promotion guards
        working-directory: tools
        run: >-
          python -m unittest -v
          test_apply_exact_source_gallery_promotion.py
          test_preflight_exact_source_gallery_evidence.py
          test_plan_gallery_merge.py
          test_resolve_gallery_merge.py
          test_build_gallery_promotion_manifest.py
      - name: Rebuild authorizations and plan exact-source production deltas
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/exact-source-gallery-promotion"
          mkdir -p "$root"
          auth_list="$RUNNER_TEMP/exact-source-authorization-list.txt"
          if [[ -n "$GALLERY_AUTHORIZATION" ]]; then
            printf '%s\n' "$GALLERY_AUTHORIZATION" > "$auth_list"
          else
            python - "$auth_list" <<'PY'
          import glob, json, sys
          from pathlib import Path
          selected=[]
          for raw in sorted(glob.glob('docs/evidence/external-source-001-*-canonical-preflight-*.json')):
              path=Path(raw)
              data=json.loads(path.read_text(encoding='utf-8'))
              decision=data.get('decision') or {}
              resolution=data.get('resolution') or {}
              evidence=str(data.get('sourceEvidence') or '').strip()
              if (
                  decision.get('identity') == 'map_existing_exact_source'
                  and decision.get('canonicalPromotionAuthorizationReady') is True
                  and int(resolution.get('replaceExisting') or 0) == 0
                  and str(resolution.get('anchorSourceSha256') or '').strip()
                  and evidence
                  and Path(evidence).is_file()
              ):
                  selected.append(raw)
          if not selected:
              raise SystemExit('no approved exact-source promotion authorization found')
          Path(sys.argv[1]).write_text('\n'.join(selected)+'\n', encoding='utf-8')
          print(json.dumps({'selected': selected}, ensure_ascii=False))
          PY
          fi

          while IFS= read -r authorization; do
            [[ -n "$authorization" ]] || continue
            python - "$authorization" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          data=json.loads(path.read_text(encoding='utf-8'))
          decision=data.get('decision') or {}
          resolution=data.get('resolution') or {}
          if decision.get('identity') != 'map_existing_exact_source':
              raise SystemExit(f'authorization is not exact-source: {path}')
          if decision.get('canonicalPromotionAuthorizationReady') is not True:
              raise SystemExit(f'authorization is not ready: {path}')
          if int(resolution.get('replaceExisting') or 0) != 0:
              raise SystemExit(f'exact-source authorization cannot replace existing media: {path}')
          if not str(resolution.get('anchorSourceSha256') or '').strip():
              raise SystemExit(f'exact-source authorization missing anchorSourceSha256: {path}')
          PY
            if [[ -n "$GALLERY_EVIDENCE" ]]; then
              evidence="$GALLERY_EVIDENCE"
            else
              evidence="$(python - "$authorization" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(str(data.get('sourceEvidence') or ''))
          PY
              )"
            fi
            test -f "$evidence" || { echo "::error::source evidence ausente para $authorization: $evidence"; exit 1; }
            name="$(basename "$authorization" .json)"
            args=(
              "$evidence"
              --authorization "$authorization"
              --source-contract config/external-sources/external-source-001.json
              --production-bucket tonecos-catalogo-media
              --summary "$root/$name.json"
            )
            if [[ "$APPLY_GALLERY" == "true" ]]; then
              args+=(--apply)
            fi
            python tools/apply_exact_source_gallery_promotion.py "${args[@]}"
          done < "$auth_list"
      - name: Assert exact-source promotion results
        shell: bash
        run: |
          python - "$RUNNER_TEMP/exact-source-gallery-promotion" "$APPLY_GALLERY" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          applying=sys.argv[2].lower() == 'true'
          summaries=[]
          for path in sorted(root.glob('*.json')):
              summary=json.loads(path.read_text(encoding='utf-8'))
              auth_path=Path('docs/evidence')/path.name
              if not auth_path.is_file():
                  matches=list(Path('docs/evidence').glob(path.stem+'.json'))
                  if len(matches) != 1:
                      raise AssertionError(f'authorization not found for {path.name}')
                  auth_path=matches[0]
              auth=json.loads(auth_path.read_text(encoding='utf-8'))
              resolution=auth['resolution']
              assert (auth.get('decision') or {}).get('identity') == 'map_existing_exact_source'
              assert summary['targetModelId'] == auth['targetModelId']
              assert summary['resolutionSha256'] == resolution['resolutionSha256']
              assert summary['productionDeletes'] == 0
              candidate=summary['candidate']
              assert candidate['reusedCoverSourceSha256'] == resolution['anchorSourceSha256']
              if summary['state'] != 'already_applied':
                  assert summary['before']['coverStorageKey'] == candidate['coverStorageKey']
                  assert candidate['imageCount'] == summary['before']['imageCount'] + int(resolution['addView'])
              if applying:
                  assert summary['state'] in {'applied_verified','already_applied'}
              else:
                  assert summary['state'] in {'dry_run_ready','already_applied'}
                  assert summary['d1Writes'] == 0
                  if summary['state'] == 'dry_run_ready':
                      assert summary['r2']['written'] == 0
              summaries.append(summary)
          assert summaries
          batch={'version':1,'models':len(summaries),'apply':applying,'summaries':summaries,'productionDeletes':0}
          (root/'batch-summary.json').write_text(json.dumps(batch, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(batch, ensure_ascii=False))
          PY
      - name: Verify public catalog after apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: bash
        run: python tools/verify_public_catalog.py --api-base "$CATALOG_API_URL"
      - name: Upload exact-source promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exact-source-gallery-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-source-gallery-promotion
          if-no-files-found: error
          retention-days: 7
